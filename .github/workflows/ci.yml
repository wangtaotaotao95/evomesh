name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,mcp]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python examples/evolution_demo.py
      - run: python examples/framework_app.py && python examples/team.py
      - run: evomesh init && evomesh run --demo 'List my workspace'
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: evomesh_test
          MYSQL_USER: evomesh
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      EVOMESH_TEST_DATABASE_URL: mysql+pymysql://evomesh:ci-password@127.0.0.1:3306/evomesh_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,mysql,mcp]'
      - run: pytest -q
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t evomesh:test .
      - run: docker run --rm evomesh:test --help
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: docker pull python:3.12-slim
      - run: EVOMESH_TEST_DOCKER=1 pytest tests/test_capabilities.py -q

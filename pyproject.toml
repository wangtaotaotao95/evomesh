[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evomesh-agent"
version = "0.1.0a1"
description = "A personal agent and framework that evolves its whole stack across instances."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["sqlalchemy>=2.0,<2.1", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
mysql = ["pymysql[rsa]>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
evomesh = "evomesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evomesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

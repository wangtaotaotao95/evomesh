[evomesh]
project = "personal"
owner = "personal"
workspace = "workspace"
repo = "."
database_url = "sqlite:///.evomesh/ledger.db"
demo = true
history_turns = 20
context_chars = 120000 # Inference JSON character budget, not provider tokens.
repeat_limit = 3 # Identical tool/argument attempts per turn.
max_steps = 12
auto_reflect = false
terminal = "disabled" # Opt in to "local" or "docker".
allowed_hosts = [] # For read_web, e.g. ["example.com"].
browser = false # pip install -e '.[browser]' && python -m playwright install chromium
browser_allowed_hosts = [] # ["example.com"] or ["*"] for public HTTPS hosts.
proactive_evolution = false # Turn on active reviews in an idle console/task worker.
evolution_interval_seconds = 3600 # Project-wide cooldown; minimum 300 seconds.
evolution_max_steps = 32 # Independent of the interactive assistant's max_steps.
evolution_checks = [] # Optional automatic integration; e.g. [["python", "-m", "pytest", "-q"]].
evolution_branch = "evolution/main" # Validated commits; deployment remains explicit.
plugin_modules = [] # Trusted Python modules exporting register(app).

# Set demo=false for real inference, and provide model/base_url here or through env.
# model = "your-tool-capable-model"
# base_url = "https://your-provider.example/v1"
# API keys belong in EVOMESH_API_KEY, not in this file.

# Optional: pip install -e '.[mcp]'; configure trusted stdio servers.
# [evomesh.mcp_servers]
# project_tools = ["python", "/absolute/path/to/mcp_server.py"]
